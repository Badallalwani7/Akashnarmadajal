<div style="flex: 1; min-width: 0"><div style="font-family: 'Fraunces', serif; font-size: 20px; font-weight: 500; letter-spacing: -0.3px">Chat with Pt. Raghav</div><div style="font-size: 12px; font-weight: 600; color: #585C78; margin-top: 1px">₹18/min · <span style="color: rgb(173,76,29); font-weight: 800">first 5 min free</span></div></div>

<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px"><span style="font-size: 13px; font-weight: 800">Birth details</span><span style="font-size: 12px; font-weight: 600; color: #12805A; display: flex; align-items: center; gap: 4px"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg>Saved · edit anytime</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px">
<div style="padding: 9px 12px; border-radius: 14px; background: #F4F5F9"><label for="in-name" style="display: block; font-size: 11px; font-weight: 600; color: #585C78">Name</label><input id="in-name" type="text" value="Aanya Sharma" style="width: 100%; border: 0; padding: 0; margin-top: 1px; background: transparent; outline: none; font-size: 14px; font-weight: 700; color: #16183A"></div>
<div style="padding: 9px 12px; border-radius: 14px; background: #F4F5F9"><label for="in-gender" style="display: block; font-size: 11px; font-weight: 600; color: #585C78">Gender</label><input id="in-gender" type="text" value="Female" style="width: 100%; border: 0; padding: 0; margin-top: 1px; background: transparent; outline: none; font-size: 14px; font-weight: 700; color: #16183A"></div>

<div style="padding: 9px 12px; border-radius: 14px; background: #F4F5F9"><label for="in-tob" style="display: block; font-size: 11px; font-weight: 600; color: #585C78">Time of birth</label><input id="in-tob" type="text" value="06:42 AM" style="width: 100%; border: 0; padding: 0; margin-top: 1px; background: transparent; outline: none; font-size: 14px; font-weight: 700; color: #16183A"></div>
<div style="padding: 9px 12px; border-radius: 14px; background: #F4F5F9"><label for="in-pob" style="display: block; font-size: 11px; font-weight: 600; color: #585C78">Place of birth</label><input id="in-pob" type="text" value="Jabalpur, MP" style="width: 100%; border: 0; padding: 0; margin-top: 1px; background: transparent; outline: none; font-size: 14px; font-weight: 700; color: #16183A"></div>
<div style="padding: 9px 12px; border-radius: 14px; background: #F4F5F9"><label for="in-ms" style="display: block; font-size: 11px; font-weight: 600; color: #585C78">Marital status</label><input id="in-ms" type="text" value="Single" style="width: 100%; border: 0; padding: 0; margin-top: 1px; background: transparent; outline: none; font-size: 14px; font-weight: 700; color: #16183A"></div>
</div>
<div style="font-size: 13px; font-weight: 800; margin-top: 16px">Your question is about</div>
<div role="radiogroup" aria-label="Topic" style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap">
<button role="radio" aria-checked="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1.5px solid #F06A28; background: rgba(240,106,40,0.13); color: rgb(173,76,29); font-size: 13px; font-weight: 800">Career</button>
<button role="radio" aria-checked="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E4E6EE; background: #FFFFFF; color: #16183A; font-size: 13px; font-weight: 700">Love</button>
<button role="radio" aria-checked="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E4E6EE; background: #FFFFFF; color: #16183A; font-size: 13px; font-weight: 700">Marriage</button>
<button role="radio" aria-checked="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E4E6EE; background: #FFFFFF; color: #16183A; font-size: 13px; font-weight: 700">Health</button>
<button role="radio" aria-checked="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E4E6EE; background: #FFFFFF; color: #16183A; font-size: 13px; font-weight: 700">Money</button>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">

<a href="chat.html" style="height: 56px; border-radius: 28px; background: #16183A; color: #FFFFFF; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>Start free chat</a>
